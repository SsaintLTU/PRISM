[general]
snapshot_interval = 60
autosave_interval = 15

[mods_api]
client_id = ""
client_secret = ""
cache_hours = 24
discord_webhook = ""
discord_username = "PRISM"
discord_avatar = ""

[hosts]
cruise = "cruise"
drift = "drift"
race = "race"

[mode_cruise]
money_per_km = 7.5
xp_per_km = 0.25
speed_limit = 120
penalty_multiplier = 0.35
; treat the server as full when this many players are connected (controls AFK queue and interest scaling)
max_players = 20
; base bank interest percentage applied with zero players online
bank_interest_rate = 0.024
; additional percentage points added per connected player
bank_interest_rate_per_player = 0.02
; additional percentage points added for identity-verified players
bank_interest_verified_bonus = 0.02
bank_deposit_step = 500
bank_withdraw_step = 500
; salary pool earnings and milestone bonus settings
salary_per_km = 10
salary_bonus_km = 100
salary_bonus_amount = 1000
salary_interval = 2700
afk_warn_seconds = 720
afk_kick_seconds = 900
license_km = 44
police_officers = "Officer1,Officer2"
teleports[] = "pits|Pitlane|/ujoin %s"
teleports[] = "garage|Garage|/pitlane %s"
traffic_checks[32] = "1|180"

[mode_cruise.jobs.bolt]
name = "Bolt Courier"
category = "delivery"
start_circle = 70
finish_circle = 75
required_skin_ids = "BOLT_COURIER"
payout_per_km = 15
finish_bonus = 500
start_message = "^2Bolt shift started. Deliver the parcels!"
finish_message = "^2Bolt delivery finished. Report back to dispatch."

[mode_cruise.host_cruise]
; optional host-specific adjustments for the cruise server
