[database]
dsn = "mysql:host=127.0.0.1;dbname=lfs;charset=utf8mb4"
username = "lfsuser"
password = "changeme"

[general]
snapshot_interval = 60
autosave_interval = 15

[hosts]
cruise = "cruise"
drift = "drift"
race = "race"

[mode_cruise]
money_per_km = 7.5
xp_per_km = 0.25
speed_limit = 120
penalty_multiplier = 0.35
bank_interest_rate = 0.25
bank_deposit_step = 500
bank_withdraw_step = 500
salary_amount = 350
salary_interval = 900
afk_warn_seconds = 720
afk_kick_seconds = 900
license_km = 44
police_officers = "Officer1,Officer2"
teleports[] = "pits|Pitlane|/ujoin %s"
teleports[] = "garage|Garage|/pitlane %s"
traffic_checks[32] = "1|180"

[mode_cruise.host_cruise]
; optional host-specific adjustments for the cruise server
money_per_km = 8.0

[mode_drift]
money_per_km = 5.0
xp_per_km = 0.4
angle_bonus = 1.6
angle_threshold = 35

[mode_race]
money_per_km = 9.0
xp_per_km = 0.3
lap_bonus = 25
lap_xp = 2.0

[traffic_lights]
enabled = true
index = 149
sequence = "red:25,red_yellow:3,green:25,yellow:3"
lights = "1@0,2@18"

[traffic_lights.cruise]
; override default lights when the cruise mode is active
lights = "1@0,2@18,3@36"

[traffic_lights.host_cruise]
; host-specific overrides (applied before mode overrides)
sequence = "red:20,red_yellow:3,green:20,yellow:3"
