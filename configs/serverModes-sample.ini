min_speed_kph = 25
combo_timeout = 2.5
points_scale = 105000
speed_scale = 120
min_combo_points = 75
leaderboard_limit = 5
leaderboard_cache_ttl = 20
layouts[] = "BL1"
layouts[] = "BL1R"

[mode_race]
money_per_km = 9.0
xp_per_km = 0.3
lap_bonus = 25
lap_xp = 2.0
classes = GTI,GTR,Formula
class.gti = XFG,XRG
class.gtr = FXR,XRR,FZR
class.formula = FOX,FO8,BF1
points = 15,12,10
qual_short_duration = 60
vote_options = BL1,SO3,FE2
vote_random.bl1 = BL1R,BL1X
